name: release

# Reproducible CLI build + publish to GitHub Releases.
# MANUAL trigger (Actions tab → Run workflow): pass an existing git tag; the
# build checks out that immutable tag and attaches tokenmoth-<target>.tar.gz
# (+ .sha256 sidecar) to the GitHub Release for that tag. get.tokenmoth.com
# redirects the legacy dist paths onto these assets (frontend/next.config.mjs).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build + publish (must already exist, e.g. cli-v0.1.5)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # The npm package version is derived from the tag, and npm's postinstall
      # fetches releases/v<version>/… — so the Cargo crate version must match
      # the tag or the published binary would report the wrong version.
      - name: Assert Cargo version matches tag
        shell: bash
        run: |
          tag="${{ inputs.tag }}"; tag_ver="${tag#cli-v}"
          cargo_ver="$(grep -m1 '^version' backend/crates/cli/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "$cargo_ver" != "$tag_ver" ]]; then
            echo "::error::backend/crates/cli/Cargo.toml version ($cargo_ver) does not match tag version ($tag_ver) — bump the crate version and re-tag."
            exit 1
          fi
          echo "✓ Cargo version $cargo_ver matches tag $tag"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI
        working-directory: backend
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p tokenmoth-cli --target ${{ matrix.target }}

      # bash on every runner (Git Bash on Windows) so the tar/.exe handling is
      # uniform. Windows builds carry a `.exe`; the archive name convention
      # (tokenmoth-<target>.tar.gz, binary `tokenmoth[.exe]` inside) is unchanged.
      - name: Package
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          bin="backend/target/${{ matrix.target }}/release/tokenmoth${ext}"
          tar -czf "tokenmoth-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" "tokenmoth${ext}"
          # sha256 sidecar — lets curl users verify the download.
          if command -v sha256sum >/dev/null; then
            sha256sum "tokenmoth-${{ matrix.target }}.tar.gz" | awk '{print $1}' > "tokenmoth-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "tokenmoth-${{ matrix.target }}.tar.gz" | awk '{print $1}' > "tokenmoth-${{ matrix.target }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tokenmoth-${{ matrix.target }}
          path: tokenmoth-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  # ── GitHub Release ───────────────────────────────────────────────────────
  # One job attaches every target's artifacts, so a release is never left
  # half-populated by a single failed matrix leg. Marked "latest" so the
  # installers' releases/latest/download/<file> URLs resolve to it.
  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest               --title "tokenmoth CLI ${TAG#cli-v}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --latest

  # ── npm channel ──────────────────────────────────────────────────────────
  # `npm i -g tokenmoth` / `npx tokenmoth`. Highest-reach path for the Claude
  # Code audience (everyone already has Node). The package itself ships no
  # binary — its postinstall downloads the artifacts the build job just pushed.
  publish-npm:
    name: publish npm
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Set version from tag
        working-directory: npm
        # tag cli-vX.Y.Z → package version X.Y.Z (no git tag/commit side effects).
        run: |
          ver="${{ inputs.tag }}"; ver="${ver#cli-v}"
          npm version "$ver" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
